name: Teknik Komut Dinleyici

# Admin'in botla özel sohbetinde yazdığı "/teknik <M5|M15|M30|H1|H4>"
# komutlarını yakalayıp o an bir teknik analiz grafiği üretip cevap olarak
# gönderir. GitHub cron'un en küçük aralığı 5 dakikadır; bu yüzden anlık
# değil, en fazla birkaç dakika gecikmeli cevap gelir.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: teknik-komut
  cancel-in-progress: false

jobs:
  dinle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Komutları kontrol et ve cevapla
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID:  ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TWELVE_DATA_API_KEY:     ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python komut.py

      - name: Komut takip durumunu kaydet
        run: |
          if [ -n "$(git status --porcelain state/komut_takip.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/komut_takip.json
            git commit -m "chore: komut takip durumu"
            git pull --rebase --autostash origin main || true
            git push || echo "push basarisiz (best-effort)"
          else
            echo "takip degismedi"
          fi
